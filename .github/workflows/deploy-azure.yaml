name: CI/CD - Build e Publicacao no Azure ACR

on:
  push:
    branches:
      - main
      - ci/deploy-azure-acr
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build Docker e Push no ACR
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Instalar PyTorch CPU-Only (Otimizado)
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: 4. Instalar Dependencias e Pytest
        run: |
          pip install pytest httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 5. Smoke Tests de Validacao
        run: |
          pytest tests/test_smoke.py

      - name: 6. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 7. Login no Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: acrorquestradorroles.azurecr.io
          username: acrorquestradorroles
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 8. Build e Push da Imagem para o ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            acrorquestradorroles.azurecr.io/orquestrador-roles:latest
            acrorquestradorroles.azurecr.io/orquestrador-roles:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
