# Transcrição de fala (ADR 0006).

[transcricao]
# Padrão escolhido em 05/11: Groq, com a retenção zero ligada na conta (Settings > Data Controls).
# Locais: mlx_whisper (Mac com Apple Silicon; o modelo medium foi o melhor nas gravações) ou faster_whisper
# (só com GPU NVIDIA; na CPU, o modelo small erra demais e os grandes passam de 3 s por frase).
provedor = "groq"   # groq | mlx_whisper | faster_whisper
idioma = "pt"
# Vocabulário do domínio. O efeito é medido com e sem (python -m voz medir --sem-prompt).
prompt = "Conversa entre amigos de Brasília combinando um rolê: bora, partiu, rachar, conto, pila, liso, trampo, Uber, iFood, Pix, Taguatinga, Ceilândia, Asa Sul, Sudoeste, Águas Claras."

[faster_whisper]
# small | medium | large-v3-turbo (int8 na CPU; float16 se houver GPU NVIDIA)
modelo = "small"
dispositivo = "cpu"
computacao = "int8"
feixe = 1
vad = true
threads = 8   # medido em 05/11: 8 threads ~10% mais rápido que o padrão no i5-1334U

[mlx_whisper]
# Só no Mac com Apple Silicon (pip install mlx-whisper). Nas gravações de 05/11, o medium teve o menor erro
# nos termos críticos (2,9%) e o large-v3-turbo empatou com o Groq (5,9%), ambos abaixo de 1 s.
modelo = "mlx-community/whisper-medium-mlx"

[groq]
url = "https://api.groq.com/openai/v1/audio/transcriptions"
chave_env = "GROQ_API_KEY"
modelo = "whisper-large-v3-turbo"
timeout_s = 20
tentativas = 3
# Pausa entre pedidos só na medição (python -m voz medir), fora do tempo medido: o plano gratuito limita
# os pedidos por minuto (HTTP 429 depois de ~20 seguidos em 05/11).
pausa_medicao_s = 3.5
# Preço conferido em 05/11/2026 (groq.com/pricing): US$ 0,04 por hora, mínimo de 10 s por pedido
preco_hora_usd = 0.04
minimo_s = 10
