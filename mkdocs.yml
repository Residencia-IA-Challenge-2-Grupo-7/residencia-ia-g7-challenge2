site_name: Orquestrador de Rolês
site_description: Documentação do Grupo 7 • Residência em IA (Eldorado / UnB)
site_author: Grupo 7
site_url: https://residencia-ia-challenge-2-grupo-7.github.io/residencia-ia-g7-challenge2/

repo_name: Residencia-IA-Challenge-2-Grupo-7/residencia-ia-g7-challenge2
repo_url: https://github.com/Residencia-IA-Challenge-2-Grupo-7/residencia-ia-g7-challenge2

theme:
  name: material
  language: pt-BR
  palette:
    # 1º = Padrão: Modo Noturno (Escuro)
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
    # 2º = Modo Claro
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Início: index.md
  - Arquitetura:
      - Como Funciona o Grafo: arquitetura/multiagente.md
      - Requisitos do Sistema: produto/requisitos.md
      - Visão do Produto: produto/visao.md
      - Decisões Técnicas (ADRs): decisoes/README.md
  - Semanas:
      - Semana 01 — Descoberta: semanas/semana-01.md
      - Semana 02 — Base 2FA & RAG: semanas/semana-02.md
      - Semana 03 — Comparativo A/B: semanas/semana-03.md
      - Semana 04 — Protótipo Multiagente: semanas/semana-04.md
  - Dados & Curadoria:
      - Base de Lugares (93 Locais): dados/esquema-base.md
      - Como Curamos os Dados: dados/guia-curadoria.md
      - Cenários de Teste: dados/golden-dataset-semana3.md
  - Guia de Contribuição: guia-contribuicao.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
